# The build machine has ~16 GB of RAM; the Gradle and Kotlin daemons share it,
# so both heaps stay deliberately modest to avoid swapping / OOM.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
# Incremental Kotlin caches fail to flush on this machine (Windows file locks),
# which breaks every plugin compile. Full recompiles of the small plugin
# modules cost seconds, so keep them off.
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
